<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0a0718; --night-2:#1b1238;
  --pearl:#fbfaff; --pearl-shade:#e6e1f0; --pearl-edge:#d6cfe6;
  --seal:#a3122f; --seal-deep:#6e0a1f;
  --star:#ffe3f1; --text:#f5f0ff; --text-soft:rgba(245,240,255,.7);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--night:#0a0718;--text:#f5f0ff}}
:root[data-theme="dark"]{--night:#0a0718;--text:#f5f0ff}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--night);color:var(--text);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
#warpFlash{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 40%,rgba(225,232,255,.95) 0%,rgba(170,150,255,.35) 35%,rgba(10,7,24,0) 75%)}
canvas#planets3d{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;pointer-events:none}

/* ---------- Escena 1: la carta ---------- */
#envelopeScene{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  background:radial-gradient(120% 80% at 50% 45%,var(--night-2) 0%,var(--night) 70%);transition:opacity 1.2s ease}
#envelopeScene.gone{opacity:0;pointer-events:none}
.to{font-family:'Great Vibes',cursive;font-size:clamp(44px,13vw,72px);line-height:1;color:var(--star);
  text-shadow:0 0 22px rgba(255,170,215,.45);margin:0;transition:opacity .6s}
.hint{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:19px;color:var(--text-soft);margin:0;
  animation:breathe 2.4s ease-in-out infinite;transition:opacity .4s}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.opening .hint,.opening .to{opacity:0}

.envelope{position:relative;width:min(78vw,330px);aspect-ratio:3/2;perspective:1000px;cursor:pointer;
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.55));animation:float 4s ease-in-out infinite;border:0;background:none;padding:0}
.envelope:focus-visible{outline:2px solid var(--star);outline-offset:10px;border-radius:8px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.opening .envelope{animation:none}
.env-back{position:absolute;inset:0;background:var(--pearl-shade);border-radius:6px}
.letter{position:absolute;left:7%;right:7%;top:7%;bottom:7%;z-index:2;background:var(--pearl);border-radius:3px;
  display:flex;align-items:center;justify-content:center;font-family:'Great Vibes',cursive;font-size:30px;color:var(--seal);
  transition:transform 1.1s cubic-bezier(.2,.8,.2,1),box-shadow 1.2s}
.env-front{position:absolute;inset:0;z-index:3;border-radius:6px;
  background:linear-gradient(160deg,var(--pearl) 0%,#f1eef8 100%);
  clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env-front::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top right,transparent 49.6%,var(--pearl-edge) 50%,transparent 50.4%) left/50% 100% no-repeat,
             linear-gradient(to top left,transparent 49.6%,var(--pearl-edge) 50%,transparent 50.4%) right/50% 100% no-repeat}
.flap{position:absolute;left:0;right:0;top:0;height:58%;z-index:4;transform-origin:top center;
  background:linear-gradient(180deg,#f3f0fa 0%,var(--pearl) 100%);clip-path:polygon(0 0,100% 0,50% 100%);
  transition:transform .9s cubic-bezier(.5,0,.3,1)}
.seal{position:absolute;left:50%;top:58%;z-index:5;width:60px;height:60px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#d4264b 0%,var(--seal) 45%,var(--seal-deep) 100%);
  box-shadow:0 2px 6px rgba(0,0,0,.35),inset 0 -3px 6px rgba(0,0,0,.25),0 0 0 3px rgba(163,18,47,.55);
  display:flex;align-items:center;justify-content:center;transition:transform .45s cubic-bezier(.5,-0.4,.5,1),opacity .45s}
.seal svg{width:28px;height:28px;filter:drop-shadow(0 -1px 0 rgba(0,0,0,.25))}
.opening .seal{transform:translate(-50%,-50%) scale(1.25) rotate(-12deg);opacity:0}
.opening .flap{transform:rotateX(180deg)}
.opening.rise .letter{transform:translateY(-48%);box-shadow:0 0 60px 18px rgba(255,214,234,.55)}

#flash{position:fixed;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;z-index:6;pointer-events:none;
  background:radial-gradient(circle,#fff 0%,#ffe3f1 40%,rgba(255,227,241,0) 70%);transform:scale(0);opacity:0}
#flash.on{transition:transform 1.3s cubic-bezier(.6,0,.4,1),opacity .3s;transform:scale(60);opacity:1}
#flash.off{transition:opacity 1.4s ease;transform:scale(60);opacity:0}

/* ---------- Texto de la historia ---------- */
#story{position:fixed;left:0;right:0;bottom:calc(11vh + env(safe-area-inset-bottom,0px));z-index:4;padding:0 26px;
  text-align:center;pointer-events:none}
#story p{margin:0 auto;opacity:0;filter:blur(8px);transform:translateY(10px);
  transition:opacity 1.1s ease,filter 1.1s ease,transform 1.1s ease;text-shadow:0 0 16px rgba(10,7,24,.95),0 0 28px rgba(10,7,24,.8)}
#story p.on{opacity:1;filter:blur(0);transform:none}
#story .chap{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:19px;color:var(--star)}
#story .date{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:16px;color:#f1d6a0;margin-top:2px;margin-bottom:12px}
#story .phrase{max-width:25ch;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;
  font-size:clamp(21px,5.9vw,30px);line-height:1.35;color:var(--text)}

/* ---------- Foto ---------- */
#photo{position:fixed;z-index:3;border-radius:50%;overflow:hidden;opacity:0;transform:scale(.85);
  transition:opacity 2s ease,transform 2.4s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 0 40px 6px rgba(255,190,225,.35),0 0 0 2px rgba(255,227,241,.5);pointer-events:none}
#photo.on{opacity:1;transform:none;pointer-events:auto}
#photo img{width:100%;height:100%;object-fit:cover;display:none}
#photo label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  background:radial-gradient(circle at 50% 40%,#3a2a6e 0%,#1b1238 80%);font-family:'Cormorant Garamond',Georgia,serif;
  font-style:italic;font-size:16px;color:var(--text-soft);text-align:center;padding:16px}
#photo label svg{width:34px;height:34px}
#photo input{position:absolute;opacity:0;width:1px;height:1px}

/* ---------- Final ---------- */
#finale{position:fixed;left:0;right:0;z-index:4;text-align:center;padding:0 24px;pointer-events:none}
#finale p{margin:0 auto;opacity:0;filter:blur(6px);transition:opacity 1.6s ease,filter 1.6s ease}
#finale p.on{opacity:1;filter:blur(0)}
#finale .l1,#finale .l2{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;
  font-size:clamp(20px,5.6vw,28px);line-height:1.35;max-width:24ch;text-shadow:0 0 18px rgba(10,7,24,.95)}
#finale .l3{font-family:'Great Vibes',cursive;font-size:clamp(40px,11vw,68px);line-height:1.1;margin-top:6px;color:var(--star);
  text-shadow:0 0 26px rgba(255,150,205,.6)}
#finale .l4{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:16px;color:#f1d6a0;margin-top:8px;
  text-shadow:0 0 14px rgba(10,7,24,.95)}
#replay{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:7;
  font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:18px;color:var(--text-soft);
  background:rgba(255,255,255,.06);border:1px solid rgba(255,227,241,.25);border-radius:999px;padding:9px 20px;
  opacity:0;pointer-events:none;transition:opacity 1.5s}
#replay.on{opacity:1;pointer-events:auto}
#replay:focus-visible{outline:2px solid var(--star);outline-offset:3px}

@media (prefers-reduced-motion: reduce){
  .envelope,.hint{animation:none}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="planets3d" aria-hidden="true"></canvas>
<div id="warpFlash"></div>

<section id="envelopeScene">
  <h1 class="to" id="toName">Victoria</h1>
  <button class="envelope" id="envelope" aria-label="Abrir la carta">
    <div class="env-back"></div>
    <div class="letter">♥</div>
    <div class="env-front"></div>
    <div class="flap" id="flap"></div>
    <div class="seal" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path fill="#ffd9e4" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.5 1.1 4.3 2.4h2.6C14.1 6.1 15.6 5 17.6 5 21 5 23.1 8.4 21.6 11.8 19.5 16.4 12 21 12 21z" opacity=".95"/></svg>
    </div>
  </button>
  <p class="hint">Toca la carta para abrirla</p>
</section>

<div id="flash"></div>
<div id="story"><p class="chap" id="storyChap"></p><p class="date" id="storyDate"></p><p class="phrase" id="storyLine"></p></div>

<div id="photo">
  <img id="photoImg" alt="Ella">
  <label for="photoInput">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>
    Toca para probar con su foto
  </label>
  <input type="file" id="photoInput" accept="image/*">
</div>

<div id="finale">
  <p class="l1">No te puedo regalar una galaxia,</p>
  <p class="l2">pero sí crear una para ti.</p>
  <p class="l3" id="teAmo"></p>
  <p class="l4" id="dias"></p>
</div>
<button id="replay">Volver a ver</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   CONFIGURACIÓN: aquí se cambia todo lo personal
   (en Angular esto será story.data.ts)
   ========================================================= */
const params = new URLSearchParams(location.search);
const CONFIG = {
  nombre: params.get('n') || 'Victoria',
  historia: [
    { titulo: '✨ El nacimiento de una galaxia', fecha: '13 de julio',
      texto: 'Dos caminos se cruzaron, y del polvo de estrellas empezó a nacer una galaxia que ninguno sabía que estaba buscando.' },
    { titulo: '🌙 La fuerza de gravedad', fecha: 'Los días siguientes',
      texto: 'Conversación a conversación, la gravedad nos fue acercando, hasta que estar lejos dejó de sentirse igual.' },
    { titulo: '⭐ Nuestra primera estrella', fecha: '22 de julio',
      texto: 'Entre ramen y miradas se encendió nuestra primera estrella, y supimos que juntos había mucho por explorar.' },
    { titulo: '💫 Dos estrellas, una órbita', fecha: '17 de agosto',
      texto: 'Te pedí que fueras mi novia, y desde ese día giramos juntos: ya no coincido contigo por casualidad, te elijo cada día.' },
    { titulo: '🪐 Nuestro hogar', fecha: '15 de septiembre',
      texto: 'Nuestras órbitas se unieron bajo el mismo techo, y en este pequeño planeta empezamos a construir nuestro universo.' }
  ],
  segundosPorFrase: 6.5,
  inicio: '2026-07-13'   // día en que nació la galaxia (para el contador)
};
document.getElementById('toName').textContent = CONFIG.nombre;
document.getElementById('teAmo').textContent = `Te amo, ${CONFIG.nombre} ❤️`;
{
  const dias = Math.max(1, Math.floor((Date.now() - new Date(CONFIG.inicio + 'T00:00:00')) / 86400000));
  document.getElementById('dias').textContent = `${dias} ${dias === 1 ? 'día' : 'días'} desde que nació nuestra galaxia`;
}

/* ---------- utilidades ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const tweens = [];
function tween(obj, key, to, ms, ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2) {
  for (let i = tweens.length - 1; i >= 0; i--) if (tweens[i].obj === obj && tweens[i].key === key) { tweens[i].res(); tweens.splice(i, 1); }
  return new Promise(res => tweens.push({obj, key, from: obj[key], to, ms, t: 0, ease, res}));
}

  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  placePhoto();
  resize3D();
}

/* Cámara y salto a la velocidad de la luz */
const P3 = { alpha: 0 };
const CAM = { x: 0, y: 0, z: 20, lx: 0, ly: 0, lz: 0 };
const FLY = { t: 1, from: null, to: null, warp: 0, ws: 1 };
const FL = { v: 0 };
const flashEl = document.getElementById('warpFlash');
function flyTo(to, ms, ws = 1) { FLY.from = { ...CAM }; FLY.to = to; FLY.ws = ws; FLY.t = 0; return tween(FLY, 't', 1, ms, t => t); }
function pulseFlash(v = .6) { FL.v = v; tween(FL, 'v', 0, 1600, t => 1 - Math.pow(1 - t, 2)); }
function updateFly() {
  if (!FLY.from) { flashEl.style.opacity = FL.v.toFixed(3); return; }
  const t = FLY.t, e = t < .5 ? 16 * Math.pow(t, 5) : 1 - Math.pow(-2 * t + 2, 5) / 2;
  for (const k of ['x', 'y', 'z', 'lx', 'ly', 'lz']) CAM[k] = FLY.from[k] + (FLY.to[k] - FLY.from[k]) * e;
  FLY.warp = Math.pow(Math.sin(Math.PI * t), 1.5) * FLY.ws;
  flashEl.style.opacity = t > .78 && t < 1 ? (Math.sin((t - .78) / .22 * Math.PI) * .45 * FLY.ws).toFixed(3) : '0';
  if (t >= 1) { FLY.from = null; FLY.warp = 0; flashEl.style.opacity = '0'; }
}

/* Ruido 3D para pintar las texturas sin costuras */
const PERM = (() => { const a = [...Array(256).keys()]; let sd = 7;
  const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return new Uint8Array([...a, ...a]); })();
function vnoise(x, y, z) {
  const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
  const fx = x - X, fy = y - Y, fz = z - Z;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy), w = fz * fz * (3 - 2 * fz);
  const h = (i, j, k) => PERM[PERM[PERM[(X + i) & 255] + ((Y + j) & 255)] + ((Z + k) & 255)] / 255;
  const l = (a, b, t) => a + (b - a) * t;
  return l(l(l(h(0,0,0), h(1,0,0), u), l(h(0,1,0), h(1,1,0), u), v),
           l(l(h(0,0,1), h(1,0,1), u), l(h(0,1,1), h(1,1,1), u), v), w);
}
function fbm(x, y, z, o = 5) { let s = 0, a = .5, f = 1;
  for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f, z * f); f *= 2.03; a *= .5; }
  return s / (1 - Math.pow(.5, o)); }
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const toStops = st => st.map(([t, h]) => [t, hex(h)]);
function pal(st, t) { t = Math.max(0, Math.min(1, t));
  for (let i = 1; i < st.length; i++) if (t <= st[i][0]) {
    const [t0, c0] = st[i - 1], [t1, c1] = st[i], k = (t - t0) / (t1 - t0 || 1);
    return c0.map((c, j) => c + (c1[j] - c) * k); }
  return st[st.length - 1][1]; }

const OCEAN = toStops([[0,'#061a3f'],[.6,'#13448f'],[1,'#3d86d9']]);
const LAND = toStops([[0,'#c9b48a'],[.25,'#5f8a5a'],[.6,'#3e6b4a'],[1,'#d7d2c8']]);
const ICE = toStops([[0,'#2f3a66'],[.35,'#7d93c9'],[.7,'#cfdcf6'],[1,'#ffffff']]);
function surface(p) {
  if (p.kind === 'gas') { const st = toStops(p.stops);
    return (x, y, z) => { const n = fbm(x * 2.5, y * 2.5, z * 2.5, 4);
      const b = .5 + .5 * Math.sin((y + (n - .5) * .25 * p.turb) * p.freq);
      return pal(st, b * .75 + fbm(x * 9, y * 30, z * 9, 3) * .3 - .05); }; }
  if (p.kind === 'ocean') return (x, y, z) => {
    if (Math.abs(y) + (fbm(x * 5, y * 5, z * 5, 3) - .5) * .2 > .86) return [240, 245, 255];
    const hgt = fbm(x * 1.8 + 3, y * 1.8, z * 1.8, 6);
    return hgt < .54 ? pal(OCEAN, Math.pow(hgt / .54, 2)) : pal(LAND, (hgt - .54) / .22); };
  return (x, y, z) => { const n = fbm(x * 2.5, y * 2.5, z * 2.5, 5);

  SC.forEach(sc => { sc.group = new THREE.Group(); sc.group.position.set(sc.x, sc.y, sc.z); sc.group.visible = false; scene.add(sc.group); });
  setTimeout(() => {
    [sceneBirth, sceneGravity, sceneStar, sceneOrbit, sceneHome].forEach((fn, i) => fn(SC[i]));
    buildBig();
  }, 200);
}
function render3D(dt) {
  if (!renderer) return;
  updateName(dt);
  camera.position.set(CAM.x, CAM.y, CAM.z); camera.lookAt(CAM.lx, CAM.ly, CAM.lz);
  const fov = 45 + 38 * FLY.warp;
  if (Math.abs(camera.fov - fov) > .01) { camera.fov = fov; camera.updateProjectionMatrix(); }
  const us = renderer.getPixelRatio() * H / (2 * Math.tan(camera.fov * Math.PI / 360));
  for (const m of GLOW_MATS) { m.uniforms.uScale.value = us; m.uniforms.uTime.value = time; }
  const vis = P3.alpha > .01;
  for (const sc of SC) { if (!sc.group) continue; sc.group.visible = vis; if (vis) sc.update(dt, sc.t0 == null ? -1 : time - sc.t0); }
  if (BIG.P) {
    const b = BIG.alpha > .01; BIG.P.obj.visible = BIG.mk.obj.visible = b;
    BIG.P.mat.uniforms.uAlpha.value = BIG.alpha; BIG.mk.mat.uniforms.uAlpha.value = BIG.alpha;
  }
  const any = vis || NAME.alpha > .01 || BIG.alpha > .01;
  if (any || drew3D) { renderer.render(scene, camera); drew3D = any; }
}

/* ---------- Nombre en estrellas 3D ---------- */
const NAME = { alpha: 0, mode: 'off', obj: null, n: 0 };
const NAME_VS = 'attribute float aSize; attribute float aSeed; uniform float uScale; uniform float uTime; varying float vTw;' +
  'void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = aSize * uScale / -mv.z;' +
  ' gl_Position = projectionMatrix * mv; vTw = 0.7 + 0.3 * sin(uTime * (1.5 + aSeed * 2.0) + aSeed * 30.0); }';
const NAME_FS = 'uniform float uAlpha; varying float vTw;' +
  'void main(){ float d = length(gl_PointCoord - 0.5); float core = smoothstep(0.2, 0.0, d); float glow = smoothstep(0.5, 0.0, d) * 0.4;' +
  ' float a = (core + glow) * uAlpha * vTw; if (a < 0.01) discard;' +
  ' gl_FragColor = vec4(mix(vec3(1.0, 0.7, 0.86), vec3(1.0, 0.98, 1.0), core), a); }';

function nameTargets(text) {
  const off = document.createElement('canvas'); off.width = W; off.height = H;
  const o = off.getContext('2d'), font = s => `700 ${s}px "Dancing Script", cursive`;
  let size = Math.min(H * .2, 160); o.font = font(size);
  const w = o.measureText(text).width;
  if (w > W * .86) { size *= (W * .86) / w; o.font = font(size); }
  o.fillStyle = '#fff'; o.textAlign = 'center'; o.textBaseline = 'middle';
  o.fillText(text, cx, H * .4);
  const data = o.getImageData(0, 0, W, H).data;
  let step = 2, pts;
  do {
    pts = [];
    for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step)
      if (data[(y * W + x) * 4 + 3] > 150) pts.push([x, y]);
    step++;
  } while (pts.length > 3200);
  return pts;
}
function startName() {
  const pts = nameTargets(CONFIG.nombre), n = pts.length;
  const k = 2 * CAM.z * Math.tan(Math.PI / 8) / H;
  const pos = new Float32Array(n * 3), size = new Float32Array(n), seed = new Float32Array(n);
  Object.assign(NAME, { n, from: new Float32Array(n * 3), to: new Float32Array(n * 3), vel: new Float32Array(n * 3),
    delay: new Float32Array(n).fill(1e9), dur: new Float32Array(n), base: new Float32Array(n), px: pts.map(q => q[0]),
    minX: Math.min(...pts.map(q => q[0])), maxX: Math.max(...pts.map(q => q[0])) });
  pts.forEach(([x, y], i) => {
    const j = i * 3;
    NAME.to[j] = (x - cx) * k; NAME.to[j + 1] = -(y - H * .4) * k; NAME.to[j + 2] = rand(-.3, .3);
    NAME.from[j] = rand(-14, 14); NAME.from[j + 1] = rand(-16, 16); NAME.from[j + 2] = rand(-50, 6);
    pos[j] = NAME.from[j]; pos[j + 1] = NAME.from[j + 1]; pos[j + 2] = NAME.from[j + 2];
    NAME.base[i] = size[i] = rand(.07, .12); seed[i] = Math.random();
  });
  NAME.geo = new THREE.BufferGeometry();
  NAME.geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  NAME.geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  NAME.geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  NAME.mat = new THREE.ShaderMaterial({ uniforms: { uScale: { value: 1 }, uTime: { value: 0 }, uAlpha: { value: 0 } },
    vertexShader: NAME_VS, fragmentShader: NAME_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  NAME.obj = new THREE.Points(NAME.geo, NAME.mat); NAME.obj.frustumCulled = false; scene.add(NAME.obj);
  NAME.mode = 'idle'; tween(NAME, 'alpha', 1, 1800);
}
// Las estrellas viajan desde el fondo hasta su letra, de izquierda a derecha
function formName3D() {
  const span = 5.2;
  for (let i = 0; i < NAME.n; i++) {
    NAME.delay[i] = time + .2 + (NAME.px[i] - NAME.minX) / (NAME.maxX - NAME.minX || 1) * span + rand(0, .6);
    NAME.dur[i] = rand(2, 2.8);
  }
  NAME.mode = 'form';
  return .2 + span + .6 + 2.8;
}
function explodeName() {
  const p = NAME.geo.attributes.position.array;
  for (let i = 0; i < NAME.n; i++) {
    const j = i * 3;
    NAME.vel[j] = p[j] * rand(.3, 1.2) + rand(-1, 1); NAME.vel[j + 1] = p[j + 1] * rand(.3, 1.2) + rand(-1, 1); NAME.vel[j + 2] = rand(4, 16);
  }
  NAME.mode = 'explode'; tween(NAME, 'alpha', 0, 2200);
}
function updateName(dt) {
  if (!NAME.obj) return;
  NAME.obj.visible = NAME.alpha > .01; if (!NAME.obj.visible) return;
  const p = NAME.geo.attributes.position.array, sz = NAME.geo.attributes.aSize.array;
  for (let i = 0; i < NAME.n; i++) {
    const j = i * 3;
    if (NAME.mode === 'explode') {
      p[j] += NAME.vel[j] * dt; p[j + 1] += NAME.vel[j + 1] * dt; p[j + 2] += NAME.vel[j + 2] * dt;
      NAME.vel[j + 2] *= 1 + dt * 1.5; continue;
    }
    const t = (time - NAME.delay[i]) / (NAME.dur[i] || 1);
    if (t <= 0) {
      p[j] = NAME.from[j] + Math.sin(time * .6 + i) * .15; p[j + 1] = NAME.from[j + 1] + Math.cos(time * .5 + i) * .15; p[j + 2] = NAME.from[j + 2];
      sz[i] = NAME.base[i];
    } else {
      const e = t >= 1 ? 1 : 1 - Math.pow(1 - t, 3);
      for (let a = 0; a < 3; a++) p[j + a] = NAME.from[j + a] + (NAME.to[j + a] - NAME.from[j + a]) * e;
      const fly = t < 1 ? Math.sin(Math.PI * t) : 0, spark = t > 1 && t < 1.5 ? 1 - (t - 1) / .5 : 0;
      sz[i] = NAME.base[i] * (1 + .8 * fly + 2.2 * spark);
    }
  }
  NAME.geo.attributes.position.needsUpdate = true; NAME.geo.attributes.aSize.needsUpdate = true;
  NAME.obj.rotation.y = Math.sin(time * .35) * .22; NAME.obj.rotation.x = Math.sin(time * .23) * .07;
  NAME.mat.uniforms.uAlpha.value = NAME.alpha; NAME.mat.uniforms.uTime.value = time;
  NAME.mat.uniforms.uScale.value = renderer.getPixelRatio() * H / (2 * Math.tan(camera.fov * Math.PI / 360));
}

/* Estrellas que escriben el nombre y rodean la foto */
const F = { alpha: 0, ringRot: 0 };
const fp = Array.from({length: 900}, () => ({
  x: rand(0, innerWidth), y: rand(0, innerHeight), vx: rand(-8, 8), vy: rand(-8, 8),
  tx: 0, ty: 0, mode: 'free', k: rand(1.2, 2.8), s: rand(.7, 1.6), f: rand(1, 3), p: rand(0, 6.28),
  ta: 0, tr: 0
}));

function namePoints(text) {
  const off = document.createElement('canvas'); off.width = W; off.height = H;
  const o = off.getContext('2d');
  let size = Math.min(H * .22, 150);
  o.font = `${size}px "Great Vibes", cursive`;
  const w = o.measureText(text).width;
  if (w > W * .86) { size *= (W * .86) / w; o.font = `${size}px "Great Vibes", cursive`; }
  o.fillStyle = '#fff'; o.textAlign = 'center'; o.textBaseline = 'middle';
  o.fillText(text, cx, cy - H * .04);
  const data = o.getImageData(0, 0, W, H).data, pts = [];
  const step = Math.max(2, Math.round(size / 26));
  for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step)
    if (data[(y * W + x) * 4 + 3] > 140) pts.push([x, y]);
  for (let i = pts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pts[i], pts[j]] = [pts[j], pts[i]]; }
  return pts;
}
function formName() {
  const pts = namePoints(CONFIG.nombre);
  let minX = Infinity, maxX = -Infinity;
  for (const q of pts) { minX = Math.min(minX, q[0]); maxX = Math.max(maxX, q[0]); }
  fp.forEach((p, i) => {
    const q = pts[i % pts.length];
    p.tx = q[0] + rand(-1, 1); p.ty = q[1] + rand(-1, 1); p.mode = 'target'; p.landed = false;
    // las estrellas llegan de izquierda a derecha, como si escribieran el nombre
    p.delay = time + .4 + ((q[0] - minX) / (maxX - minX || 1)) * 3.2 + rand(0, .5);
    p.k = rand(1.6, 2.4);
  });
}
function scatter() {
  fp.forEach(p => {
    const a = Math.atan2(p.y - cy, p.x - cx) + rand(-.6, .6), v = rand(30, 160);
    p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v; p.mode = 'free';
  });
}
let photoBox = { x: 0, y: 0, r: 100 };
function placePhoto() {
  const r = Math.min(W, H) * .27;
  photoBox = { x: cx, y: H * .38, r };
  const el = document.getElementById('photo');
  el.style.width = el.style.height = (r * 2 - 14) + 'px';
  el.style.left = (cx - r + 7) + 'px'; el.style.top = (photoBox.y - r + 7) + 'px';
  document.getElementById('finale').style.top = (photoBox.y + r + 30) + 'px';
}
function formRing() {
  fp.forEach((p, i) => {
    p.mode = 'ring'; p.ta = (i / fp.length) * Math.PI * 2 * 3 + rand(-.05, .05);
    const layer = i % 3; p.tr = photoBox.r + layer * 9 + gauss() * 4;
  });
}

/* ---------- bucle de dibujo ---------- */
let last = performance.now(), time = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000, .05); last = now; time += dt;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt * 1000;
    const k = Math.min(tw.t / tw.ms, 1);
    tw.obj[tw.key] = tw.from + (tw.to - tw.from) * tw.ease(k);
    if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
  updateFly();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#0a0718'; ctx.fillRect(0, 0, W, H);
  if (N.alpha > .01 && N.img.complete && N.img.width) {
    const sc = Math.max(W / N.img.width, H / N.img.height) * N.zoom * (1 + .35 * FLY.warp);
    const iw = N.img.width * sc, ih = N.img.height * sc;
    ctx.globalAlpha = N.alpha; ctx.drawImage(N.img, cx - iw / 2, cy - ih / 2, iw, ih); ctx.globalAlpha = 1;
  }
  ctx.globalCompositeOperation = 'lighter';

  // fondo 3D
  S.speed += (S.target - S.speed) * Math.min(1, dt * 1.5);
  if (FLY.warp > 0) S.speed = S.target + (reduced ? 500 : 2600) * FLY.warp;
  const fov = Math.max(W, H) * .6;
  if (S.alpha > .01) for (const s of bg) {
    s.z -= S.speed * dt;
    if (s.z < 1) { s.z = DEPTH; s.x = rand(-1000, 1000); s.y = rand(-1000, 1000); }
    const sx = cx + s.x / s.z * fov, sy = cy + s.y / s.z * fov;
    if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
    const near = 1 - s.z / DEPTH, r = .4 + near * 1.8;
    const a = S.alpha * (.35 + near * .65) * (.75 + .25 * Math.sin(time * 2 + s.p));
    ctx.strokeStyle = ctx.fillStyle = `rgba(235,230,255,${a})`;
    if (S.speed > 120) {
      const z2 = s.z + S.speed * .06;
      ctx.lineWidth = r; ctx.beginPath();
      ctx.moveTo(cx + s.x / z2 * fov, cy + s.y / z2 * fov); ctx.lineTo(sx, sy); ctx.stroke();
    } else { ctx.fillRect(sx - r / 2, sy - r / 2, r, r); }
  }

  // estrellas del nombre / anillo
  if (F.alpha > .01) {
    F.ringRot += dt * .12;
    for (const p of fp) {
      if (p.mode === 'ring') {
        p.tx = photoBox.x + Math.cos(p.ta + F.ringRot) * p.tr;
        p.ty = photoBox.y + Math.sin(p.ta + F.ringRot) * p.tr;
      }
      const lx = p.x, ly = p.y;
      if (p.mode === 'free' || time < p.delay) {
        p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .985; p.vy *= .985;
        if (p.x < -20) p.x = W + 20; if (p.x > W + 20) p.x = -20;
        if (p.y < -20) p.y = H + 20; if (p.y > H + 20) p.y = -20;
      } else {
        const k = Math.min(1, dt * p.k);
        p.x += (p.tx - p.x) * k; p.y += (p.ty - p.y) * k;
        if (p.mode === 'target' && !p.landed && Math.abs(p.tx - p.x) + Math.abs(p.ty - p.y) < 1.5) { p.landed = true; p.spark = 1; }
      }
      // estela mientras vuela y destello al llegar a su lugar
      const dx = p.x - lx, dy = p.y - ly, mv = Math.hypot(dx, dy);
      if (mv > 1.2 && mv < 80) {
        ctx.strokeStyle = `rgba(255,214,236,${F.alpha * .45})`; ctx.lineWidth = p.s;
        ctx.beginPath(); ctx.moveTo(p.x - dx * 6, p.y - dy * 6); ctx.lineTo(p.x, p.y); ctx.stroke();
      }
      if (p.spark > 0) {
        p.spark -= dt * 1.4;
        ctx.fillStyle = `rgba(255,236,246,${Math.max(0, p.spark) * .5 * F.alpha})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.s * 7 * Math.max(0, p.spark), 0, 6.283); ctx.fill();
      }
      const a = F.alpha * (.55 + .45 * Math.sin(time * p.f + p.p));
      ctx.fillStyle = `rgba(255,214,236,${a * .22})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.s * 2.6, 0, 6.283); ctx.fill();
      ctx.fillStyle = `rgba(255,248,252,${a})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.s * .8, 0, 6.283); ctx.fill();
    }
  }
  render3D(dt);
  requestAnimationFrame(frame);
}

/* ---------- historia ---------- */
const line = document.getElementById('storyLine'), chapEl = document.getElementById('storyChap'), dateEl = document.getElementById('storyDate');
async function say(item, secs) {
  chapEl.textContent = item.titulo; dateEl.textContent = item.fecha; line.textContent = item.texto;
  void line.offsetWidth;
  chapEl.classList.add('on'); await sleep(350);
  dateEl.classList.add('on'); await sleep(450);
  line.classList.add('on');
  await sleep(secs * 1000);
  [chapEl, dateEl, line].forEach(e => e.classList.remove('on'));
  await sleep(1100);
}

async function run() {
  // 2. galaxia y nombre
  tween(S, 'alpha', 1, 1500); S.target = 25;
  tween(N, 'alpha', .55, 2500);
  if (renderer) {
    startName();
    await sleep(2000);
    const formado = formName3D();
    await sleep((formado + 4.5) * 1000);
  } else {
    await sleep(600);
    tween(F, 'alpha', 1, 1800);
    await sleep(1600);
    formName();
    await sleep(8200);
  }

  // 3. viaje: un salto a la velocidad de la luz hacia cada momento
  if (renderer) explodeName(); else { scatter(); tween(F, 'alpha', .25, 2500); }
  tween(N, 'alpha', 1, 3000);
  tween(P3, 'alpha', 1, 2500);
  S.target = reduced ? 20 : 60;
  const salto = reduced ? 1400 : 2600;
  tween(N, 'zoom', 1.7, (CONFIG.segundosPorFrase + 2 + salto / 1000) * 1000 * CONFIG.historia.length, t => t);
  await sleep(1800);
  for (let i = 0; i < CONFIG.historia.length; i++) {
    const sc = SC[i % SC.length];
    if (renderer) { await flyTo(viewOf(sc), salto); sc.t0 = time; }
    await say(CONFIG.historia[i], CONFIG.segundosPorFrase);
  }
  // nos alejamos: todos los momentos forman una sola galaxia
  if (renderer) {
    tween(BIG, 'alpha', .9, 4500);
    await flyTo(finalView(), 5200, .3);
  }

  // 4. la foto
  S.target = 18; tween(N, 'alpha', .5, 2500);
  formRing(); tween(F, 'alpha', 1, 1500);
  await sleep(1800);
  document.getElementById('photo').classList.add('on');
  await sleep(3200);

  // 5. final
  const fin = document.querySelectorAll('#finale p');
  for (const p of fin) { p.classList.add('on'); await sleep(2300); }
  await sleep(1500);
  document.getElementById('replay').classList.add('on');
}

/* ---------- abrir la carta ---------- */
let opened = false;
async function openLetter() {
  if (opened) return; opened = true;
  const scene = document.getElementById('envelopeScene'), flap = document.getElementById('flap');
  scene.classList.add('opening');
  await sleep(450);
  setTimeout(() => flap.style.zIndex = 1, 450);
  await sleep(900);
  scene.classList.add('rise');
  await sleep(1100);
  const flash = document.getElementById('flash');
  const r = document.querySelector('.letter').getBoundingClientRect();
  flash.style.left = (r.left + r.width / 2) + 'px'; flash.style.top = (r.top + r.height / 2) + 'px';
  flash.classList.add('on');
  await sleep(1300);
  scene.classList.add('gone');
  run();
  flash.classList.replace('on', 'off');
}
document.getElementById('envelope').addEventListener('click', openLetter);
document.getElementById('replay').addEventListener('click', () => location.reload());
document.getElementById('photoInput').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const img = document.getElementById('photoImg');
  img.src = URL.createObjectURL(f); img.style.display = 'block';
  document.querySelector('#photo label').style.display = 'none';
});

window.addEventListener('resize', resize);
resize();
init3D();
Promise.all([document.fonts.load('80px "Great Vibes"'), document.fonts.load('700 80px "Dancing Script"')]).finally(() => requestAnimationFrame(t => { last = t; frame(t); }));
</script>
</body>
