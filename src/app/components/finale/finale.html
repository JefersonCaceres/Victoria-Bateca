<div class="photo" [class.on]="s.photoOn()"
     [style.width.px]="box().size" [style.height.px]="box().size" [style.left.px]="box().left" [style.top.px]="box().top">
  @for (f of fotos(); track f; let i = $index) {
    <img [src]="f" alt="Ella" [class.on]="i === actual()">
  } @empty {
    <div class="placeholder" aria-hidden="true">♥</div>
  }
</div>

<div class="finale" [style.top.px]="box().finaleTop">
  @for (l of lineas; track l.cls; let i = $index) {
    <p [class]="l.cls" [class.on]="s.finaleStep() > i">{{ l.text }}</p>
  }
</div>
<button class="replay" [class.on]="s.replayOn()" (click)="volver()">Volver a ver</button>
